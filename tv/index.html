<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>kopsiliakosTV</title>
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
    }

    #video-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .video-js {
      width: 100% !important;
      height: 100% !important;
    }

    /* Logo Styling */
    .logo {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10; /* Make sure logo is above the video */
      width: 120px; /* Set your desired logo size */
      height: auto;
    }

    /* Hide progress bar and time */
    .vjs-progress-control,
    .vjs-current-time,
    .vjs-duration,
    .vjs-time-divider {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="video-container">
  <!-- Logo on Top Left -->
  <img src="logo.png" alt="Logo" class="logo" />

  <video
    id="my-video"
    class="video-js vjs-default-skin"
    controls
    autoplay
    loop
    muted
    playsinline
    data-setup='{"liveui": true}'>
    <source src="idle.mp4" type="video/mp4" />
  </video>
</div>

<script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
<script>
  const player = videojs('my-video');
  player.ready(() => {
    player.liveTracker?.setLive(true); // Optional: enables "LIVE" badge
  });
</script>

</body>
</html>
